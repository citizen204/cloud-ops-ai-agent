<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1080" viewBox="0 0 860 1080">
  <defs>
    <style>
      .bg       { fill: #1e1e2e; }
      .titlebar { fill: #313244; }
      .dot-r    { fill: #ff5f57; }
      .dot-y    { fill: #febc2e; }
      .dot-g    { fill: #28c840; }
      .prompt   { fill: #cba6f7; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .cmd      { fill: #89dceb; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .key      { fill: #f38ba8; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .val-str  { fill: #a6e3a1; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .val-bool { fill: #fab387; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .val-null { fill: #6c7086; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .plain    { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .comment  { fill: #6c7086; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .label-safe   { fill: #a6e3a1; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      .label-risk   { fill: #f38ba8; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      .label-info   { fill: #89dceb; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: bold; }
      .section-bg-safe { fill: #1a2f1a; }
      .section-bg-risk { fill: #2f1a1a; }
      .section-bg-info { fill: #1a1f2f; }
      .divider  { stroke: #45475a; stroke-width: 1; }
      .title    { fill: #cdd6f4; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="1080" class="bg" rx="10"/>

  <!-- Title bar -->
  <rect width="860" height="38" class="titlebar" rx="10"/>
  <rect y="20" width="860" height="18" class="titlebar"/>
  <circle cx="20" cy="19" r="7" class="dot-r"/>
  <circle cx="40" cy="19" r="7" class="dot-y"/>
  <circle cx="60" cy="19" r="7" class="dot-g"/>
  <text x="430" y="24" text-anchor="middle" class="title">cloud-ops-ai-agent — API Live Demo</text>

  <!-- ── SECTION 1: Health Check ── -->
  <rect x="12" y="50" width="836" height="110" class="section-bg-info" rx="4"/>
  <text x="20" y="68" class="label-info"># ── 1. Health Check ───────────────────────────────────────────────────</text>

  <text x="20" y="88"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s http://localhost:8000/health | jq .</tspan></text>

  <text x="20" y="108"><tspan class="plain">{</tspan></text>
  <text x="20" y="123"><tspan class="plain">  </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"ok"</tspan><tspan class="plain">,  </tspan><tspan class="key">"version"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"0.1.0"</tspan><tspan class="plain">,  </tspan><tspan class="key">"high_risk_operations"</tspan><tspan class="plain">: [</tspan><tspan class="val-str">"delete_instance"</tspan><tspan class="plain">, </tspan><tspan class="val-str">"deploy_to_production"</tspan><tspan class="plain">, ...]</tspan></text>
  <text x="20" y="138"><tspan class="plain">}</tspan></text>

  <!-- ── SECTION 2: List Operations ── -->
  <rect x="12" y="172" width="836" height="130" class="section-bg-info" rx="4"/>
  <text x="20" y="190" class="label-info"># ── 2. List Available Operations ──────────────────────────────────────</text>

  <text x="20" y="210"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s http://localhost:8000/api/v1/operations | jq '.[] | {name, risk}'</tspan></text>

  <text x="20" y="230"><tspan class="plain">{ </tspan><tspan class="key">"name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"list_instances"</tspan><tspan class="plain">,     </tspan><tspan class="key">"risk"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"safe"</tspan><tspan class="plain"> }</tspan></text>
  <text x="20" y="245"><tspan class="plain">{ </tspan><tspan class="key">"name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"describe_instance"</tspan><tspan class="plain">,  </tspan><tspan class="key">"risk"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"safe"</tspan><tspan class="plain"> }</tspan></text>
  <text x="20" y="260"><tspan class="plain">{ </tspan><tspan class="key">"name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"delete_instance"</tspan><tspan class="plain">,   </tspan><tspan class="key">"risk"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"high"</tspan><tspan class="plain"> }  </tspan><tspan class="comment">← requires confirmation</tspan></text>
  <text x="20" y="275"><tspan class="plain">{ </tspan><tspan class="key">"name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"deploy_to_production"</tspan><tspan class="plain">,</tspan><tspan class="key">"risk"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"high"</tspan><tspan class="plain"> }  </tspan><tspan class="comment">← requires confirmation</tspan></text>
  <text x="20" y="290"><tspan class="plain">{ </tspan><tspan class="key">"name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"scale_down_cluster"</tspan><tspan class="plain">, </tspan><tspan class="key">"risk"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"high"</tspan><tspan class="plain"> }  </tspan><tspan class="comment">← requires confirmation</tspan></text>

  <!-- ── SECTION 3: Safe Task ── -->
  <rect x="12" y="314" width="836" height="185" class="section-bg-safe" rx="4"/>
  <text x="20" y="332" class="label-safe"># ── 3. Safe Task: list_instances (runs immediately) ──────────────────</text>

  <text x="20" y="352"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s -X POST http://localhost:8000/api/v1/tasks \</tspan></text>
  <text x="20" y="367"><tspan class="plain">     -H </tspan><tspan class="val-str">'Content-Type: application/json'</tspan><tspan class="plain"> \</tspan></text>
  <text x="20" y="382"><tspan class="plain">     -d </tspan><tspan class="val-str">'{"operation":"list_instances","resource":"all","params":{}}'</tspan></text>

  <text x="20" y="402"><tspan class="plain">{</tspan></text>
  <text x="20" y="417"><tspan class="plain">  </tspan><tspan class="key">"task_id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"7a20ce1f-447f-442d-aadf-adeff63c2ef3"</tspan><tspan class="plain">,</tspan></text>
  <text x="20" y="432"><tspan class="plain">  </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"PENDING"</tspan><tspan class="plain">,</tspan></text>
  <text x="20" y="447"><tspan class="plain">  </tspan><tspan class="key">"is_high_risk"</tspan><tspan class="plain">: </tspan><tspan class="val-bool">false</tspan><tspan class="plain">,</tspan></text>
  <text x="20" y="462"><tspan class="plain">  </tspan><tspan class="key">"message"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"Task submitted and running in background."</tspan></text>
  <text x="20" y="477"><tspan class="plain">}</tspan></text>

  <!-- ── SECTION 4: Poll safe task result ── -->
  <rect x="12" y="511" width="836" height="145" class="section-bg-safe" rx="4"/>
  <text x="20" y="529" class="label-safe"># ── 4. Poll Result (COMPLETED in ~300ms) ─────────────────────────────</text>

  <text x="20" y="549"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s http://localhost:8000/api/v1/tasks/7a20ce1f-447f-442d-aadf-adeff63c2ef3 | jq .</tspan></text>

  <text x="20" y="569"><tspan class="plain">{  </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"COMPLETED"</tspan><tspan class="plain">,  </tspan><tspan class="key">"result"</tspan><tspan class="plain">: {</tspan></text>
  <text x="20" y="584"><tspan class="plain">    </tspan><tspan class="key">"instances"</tspan><tspan class="plain">: [</tspan></text>
  <text x="20" y="599"><tspan class="plain">      { </tspan><tspan class="key">"id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"vm-prod-01"</tspan><tspan class="plain">, </tspan><tspan class="key">"zone"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"us-central1-a"</tspan><tspan class="plain">, </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"RUNNING"</tspan><tspan class="plain">, </tspan><tspan class="key">"type"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"n2-standard-4"</tspan><tspan class="plain"> },</tspan></text>
  <text x="20" y="614"><tspan class="plain">      { </tspan><tspan class="key">"id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"vm-prod-02"</tspan><tspan class="plain">, </tspan><tspan class="key">"zone"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"us-central1-b"</tspan><tspan class="plain">, </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"RUNNING"</tspan><tspan class="plain">, </tspan><tspan class="key">"type"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"n2-standard-4"</tspan><tspan class="plain"> },</tspan></text>
  <text x="20" y="629"><tspan class="plain">      { </tspan><tspan class="key">"id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"vm-dev-01"</tspan><tspan class="plain">,   </tspan><tspan class="key">"zone"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"us-east1-b"</tspan><tspan class="plain">,   </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"STOPPED"</tspan><tspan class="plain">,  </tspan><tspan class="key">"type"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"e2-micro"</tspan><tspan class="plain"> } ],</tspan></text>
  <text x="20" y="644"><tspan class="plain">    </tspan><tspan class="key">"total_count"</tspan><tspan class="plain">: </tspan><tspan class="val-bool">4</tspan><tspan class="plain"> }}</tspan></text>

  <!-- ── SECTION 5: High-risk submit ── -->
  <rect x="12" y="668" width="836" height="115" class="section-bg-risk" rx="4"/>
  <text x="20" y="686" class="label-risk"># ── 5. HIGH RISK Task: deploy_to_production → AWAITING_CONFIRMATION ──</text>

  <text x="20" y="706"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s -X POST http://localhost:8000/api/v1/tasks \</tspan></text>
  <text x="20" y="721"><tspan class="plain">     -d </tspan><tspan class="val-str">'{"operation":"deploy_to_production","resource":"api-gateway",</tspan></text>
  <text x="20" y="736"><tspan class="val-str">        "params":{"service_name":"api-gateway","image_tag":"v2.4.0"}}'</tspan></text>

  <text x="20" y="756"><tspan class="plain">{  </tspan><tspan class="key">"task_id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"470d2258-b8df-441d-9304-bd273c91dd9f"</tspan><tspan class="plain">,  </tspan><tspan class="key">"is_high_risk"</tspan><tspan class="plain">: </tspan><tspan class="val-bool">true</tspan></text>
  <text x="20" y="771"><tspan class="plain">   </tspan><tspan class="key">"message"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"...HIGH RISK — send POST .../confirm with {\"confirmed\": true} to proceed."</tspan><tspan class="plain"> }</tspan></text>

  <!-- ── SECTION 6: Poll AWAITING + Confirm ── -->
  <rect x="12" y="795" width="836" height="115" class="section-bg-risk" rx="4"/>
  <text x="20" y="813" class="label-risk"># ── 6. Poll: status=AWAITING_CONFIRMATION  →  Operator Approves ──────</text>

  <text x="20" y="833"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s http://localhost:8000/api/v1/tasks/470d2258-.../  </tspan><tspan class="comment"># status check</tspan></text>
  <text x="20" y="848"><tspan class="plain">{  </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"AWAITING_CONFIRMATION"</tspan><tspan class="plain">,  </tspan><tspan class="key">"result"</tspan><tspan class="plain">: </tspan><tspan class="val-null">null</tspan><tspan class="plain"> }</tspan></text>

  <text x="20" y="868"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s -X POST http://localhost:8000/api/v1/tasks/470d2258-.../confirm \</tspan></text>
  <text x="20" y="883"><tspan class="plain">     -d </tspan><tspan class="val-str">'{"confirmed": true}'</tspan></text>
  <text x="20" y="898"><tspan class="plain">{  </tspan><tspan class="key">"confirmed"</tspan><tspan class="plain">: </tspan><tspan class="val-bool">true</tspan><tspan class="plain">,  </tspan><tspan class="key">"message"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"Operation approved. Task will proceed accordingly."</tspan><tspan class="plain"> }</tspan></text>

  <!-- ── SECTION 7: Final result ── -->
  <rect x="12" y="922" width="836" height="110" class="section-bg-safe" rx="4"/>
  <text x="20" y="940" class="label-safe"># ── 7. Poll Result After Execution (COMPLETED) ───────────────────────</text>

  <text x="20" y="960"><tspan class="prompt">$ </tspan><tspan class="cmd">curl -s http://localhost:8000/api/v1/tasks/470d2258-... | jq .result</tspan></text>

  <text x="20" y="980"><tspan class="plain">{</tspan></text>
  <text x="20" y="995"><tspan class="plain">  </tspan><tspan class="key">"status"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"DEPLOYED"</tspan><tspan class="plain">,  </tspan><tspan class="key">"service_name"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"api-gateway"</tspan><tspan class="plain">,  </tspan><tspan class="key">"image_tag"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"v2.4.0"</tspan><tspan class="plain">,</tspan></text>
  <text x="20" y="1010"><tspan class="plain">  </tspan><tspan class="key">"build_id"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"build-75450"</tspan><tspan class="plain">,</tspan></text>
  <text x="20" y="1025"><tspan class="plain">  </tspan><tspan class="key">"message"</tspan><tspan class="plain">: </tspan><tspan class="val-str">"Service 'api-gateway' updated to image 'v2.4.0' (build: build-75450)."</tspan></text>
  <text x="20" y="1040"><tspan class="plain">}</tspan></text>

  <!-- ── Footer ── -->
  <line x1="12" y1="1055" x2="848" y2="1055" class="divider"/>
  <text x="430" y="1072" text-anchor="middle" class="comment">cloud-ops-ai-agent · FastAPI + Threading · Safety Gateway · Cooperative Cancellation</text>
</svg>

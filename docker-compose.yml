version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-ops-ai-agent:latest
    container_name: cloud-ops-api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      CONFIG_PATH: "/app/config.json"
    volumes:
      # Mount config as a read-only volume so you can update it without rebuilding.
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
